name: i18n hardcoded-string scan

# Advisory scan for learner-visible strings hardcoded in package Svelte
# templates. Warn-only by design — findings land on this tracking issue for a
# human to triage, and nothing here can fail a build. Scope and rationale live
# in packages/players-shared/src/i18n/README.md.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run the scan
        run: bun run scan-hardcoded > scan-report.txt
      - name: Update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create i18n-hardcoded-scan --color F9A825 --description "Weekly hardcoded learner-visible string scan" || true
          issue=$(gh issue list --label i18n-hardcoded-scan --state open --json number --jq '.[0].number')
          if grep -q "^Hardcoded-string scan: 0 findings" scan-report.txt; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "No findings in this run."
            fi
            exit 0
          fi
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file scan-report.txt
          else
            gh issue create \
              --title "Hardcoded learner-visible strings in Svelte templates" \
              --body-file scan-report.txt \
              --label i18n-hardcoded-scan
          fi
