# Bun's test discovery claims `*.spec.ts`, and so does Playwright's default
# `testMatch`. Every Playwright spec in this repo uses that extension, so a bare
# `bun test` loads them into bun's runner, where `@playwright/test`'s `test()`
# throws on the missing worker fixtures. Ignoring the pattern here is what makes
# discovery correct however the runner is invoked — `bun test`, `bun test tests`,
# or a directory path. Before this, the six packages holding Playwright specs
# each filtered them out in their own `test` script, which held only while the
# author remembered the argument.
#
# The preload resolves `@pie-players/*` workspace siblings to their source, so a
# unit test runs against the sibling's current code whether or not it has been
# built. Rationale in `test-support/workspace-sources.ts`.
#
# Bun reads bunfig.toml from the current working directory only: no walking up to
# the workspace root, and `extends` is not supported. Turbo runs each package's
# `test` script with that package as the cwd, so every package running `bun test`
# carries its own copy of this `[test]` block, pointing back here: the preload in
# all of them, the glob in the ones holding Playwright specs. Keep the duplicated
# content to those two lines.
#
# Playwright is unaffected: it reads the `playwright.config.ts` files, not this.
[test]
pathIgnorePatterns = ["**/*.spec.ts"]
preload = ["./test-support/bun-workspace-sources.ts"]
