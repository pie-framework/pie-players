# Sourced by the generated hooks before they locate the lefthook binary, so the
# gate still resolves when git runs a hook from a linked worktree. See .lefthookrc.
#
# The "./" is required, not cosmetic. Lefthook emits `. <rc>` verbatim, and `.`
# resolves a bare name against $PATH; whether the current directory is used as a
# fallback is shell-dependent (bash does, dash and zsh do not). So `rc: .lefthookrc`
# happens to work under macOS /bin/sh and silently sources nothing under the dash
# that is /bin/sh on Debian-family systems. A path containing a slash skips the
# $PATH lookup entirely. Git runs hooks from the worktree root, so "./" is that root.
rc: ./.lefthookrc

pre-commit:
  parallel: false
  commands:
    early-local-gate:
      run: bun run verify:pre-commit

pre-push:
  parallel: false
  commands:
    # Delegates to `bun run verify:pre-push`, but only when the push actually carries new
    # commits. `use_stdin: true` is what makes that check possible: git hands a pre-push
    # hook one line per ref being pushed, and lefthook forwards stdin only to commands
    # that ask for it. Without it the script sees nothing and conservatively runs the full
    # gate, which is the old behaviour rather than a hole. See scripts/pre-push-gate.mjs.
    fast-local-gate:
      use_stdin: true
      run: bun ./scripts/pre-push-gate.mjs
